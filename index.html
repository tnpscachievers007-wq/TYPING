 var h='<div class="box"><h2>Daily goal</h2><div class="bar"><i style="width:'+Math.min(100,tdy/D.goal*100)+'%"></i></div><div class="meta"><span>'+tdy+' of '+D.goal+' items today</span><span><select id="gl" class="ch">'+[25,50,100,200,500].map(function(g){return'<option'+(g===D.goal?' selected':'')+'>'+g+'</option>'}).join('')+'</select></span></div></div>'+
 '<div class="st"><div><b>'+s+'</b><span>Day streak</span></div><div><b>'+avg+'</b><span>Average WPM</span></div><div><b>'+best+'</b><span>Best WPM</span></div><div><b>'+acc(D.ok,D.bad)+'%</b><span>Overall accuracy</span></div><div><b>'+D.best+'</b><span>Best combo</span></div><div><b>'+D.tot+'</b><span>Items typed</span></div></div>';
 h+='<div class="box"><h2>Recent rounds</h2>'+(hs.length?'<div class="hr"><b>Level</b><b>Accuracy</b><b>Time</b><b>WPM</b></div>'+hs.slice(-8).reverse().map(function(x){return'<div class="hr"><span>'+(LV[x.l]?LV[x.l].n:'-')+'</span><span>'+x.a+'%</span><span>'+fmt(x.s)+'</span><span>'+x.w+'</span></div>'}).join(''):'<p class="note" style="margin:0">Finished rounds appear here. New rounds start by themselves.</p>')+'</div>';
 h+='<div class="box"><h2>Weak items</h2>'+(wk.length?'<div class="wk">'+wk.map(function(w){return'<span>'+esc(w)+'<small>'+D.wrong[w]+'</small></span>'}).join('')+'</div><div class="ro"><button class="btn pr" id="pw">Practise weak items</button><button class="btn" id="rs">Reset stats</button></div>':'<p class="note" style="margin:0">No weak items right now. A clean answer lowers the count by one.</p><div class="ro"><button class="btn" id="rs">Reset stats</button></div>')+'</div>';
 $('#p3').innerHTML=h;
 var g=$('#gl');if(g)g.onchange=function(){D.goal=+g.value;save();stats();render()};
 if($('#pw'))$('#pw').onclick=function(){tab(0);start(shuf(wk.slice(0,10)))};
 if($('#rs'))$('#rs').onclick=function(){if(confirm('Reset all stats?')){D.days={};D.tot=D.ok=D.bad=D.best=D.rounds=0;D.wrong={};D.kw={};D.kg={};D.hist=[];sessMiss=[];save();stats();render()}}}
function heat(x){var w=D.kw[x]||0,g=D.kg[x]||0;return w>0?' hb':g>=5?' hg':''}
function cell(x){return'<button class="lt'+heat(x)+'" data-x="'+esc(x)+'">'+esc(x)+'</button>'}
function chart(){var syms=[];ROWS.join('').split('').forEach(function(k){if(!(k>='a'&&k<='z')&&!(k>='0'&&k<='9'))syms.push(k)});sp(NUMS).forEach(function(k){syms.push(SHM[k])});syms.push('_','+','{','}',':','"','<','>','?');
 var h='<div class="box"><h2>Lowercase letters</h2><div class="lg">'+sp(AZ).map(cell).join('')+'</div></div>';
 h+='<div class="box"><h2>Capital letters</h2><div class="lg">'+sp(AZ.toUpperCase()).map(cell).join('')+'</div></div>';
 h+='<div class="box"><h2>Numbers</h2><div class="lg">'+sp(NUMS).map(cell).join('')+'</div></div>';
 h+='<div class="box"><h2>Symbols</h2><div class="lg">'+syms.filter(function(v,i){return syms.indexOf(v)===i}).map(cell).join('')+'</div></div>';
 h+='<p class="note">Green means typed correctly at least 5 times. Red means recent mistakes. Tap any key to see which finger types it.</p>';
 $('#cg').innerHTML=h}
function showInfo(x){var f=fg(x);
 $('#ci').innerHTML='<div class="ci"><div class="cb">'+esc(x)+'</div><div class="cc"><div class="hint l"><span>'+esc(kn(x))+'</span><span>'+FN[f]+'</span></div><div class="cs">'+(D.kw[x]?'Missed '+D.kw[x]+' time(s) lately':D.kg[x]?'Typed correctly '+D.kg[x]+' time(s)':'Not practised yet')+'</div></div><button class="btn pr" id="dl">Drill</button></div>';
 $('#dl').onclick=function(){tab(0);start([x,x,x,x,x,x])}}
function tab(i){ROOT.querySelectorAll('.pn').forEach(function(p,j){p.classList.toggle('on',i===j)});ROOT.querySelectorAll('.tb button').forEach(function(b,j){b.classList.toggle('on',i===j)});if(i===1)chart();if(i===3)stats();window.scrollTo(0,0)}
function theme(){return TH.apply()}
// ---------- events ----------
ROOT.querySelector('.tb').onclick=function(e){var b=e.target.closest('button');if(b)tab(+b.dataset.t)};
$('#th').onclick=function(){TH.toggle()};
$('#lv').onclick=function(e){var b=e.target.closest('button');if(!b)return;D.o.lv=+b.dataset.l;save();ops();start()};
$('#rw').onclick=function(e){var b=e.target.closest('button');if(!b)return;D.o.sub=+b.dataset.w;save();ops();start()};
$('#op').onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.o)D.o[b.dataset.o]=D.o[b.dataset.o]?0:1;else D.o.len=+b.dataset.v;save();ops();if(b.dataset.v!==undefined)start();else render()};
$('#kb').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.a==='sh'){sh=!sh;render();return}
 var ch=b.dataset.c;if(!ch)return;inp(ch);if(sh){sh=false;render()}};
$('#skip').onclick=skip;$('#again').onclick=function(){start()};
$('#mist').onclick=function(){if(sessMiss.length){var l=shuf(sessMiss.slice());sessMiss=[];start(l)}};
$('#cg').onclick=function(e){var b=e.target.closest('button');if(b&&b.dataset.x)showInfo(b.dataset.x)};
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey||ROOT.hidden||!$('#p0').classList.contains('on'))return;
 if(e.target&&/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName))return;
 var k=e.key;if(k==='Enter'){e.preventDefault();skip();return}if(k==='Escape'){start();return}
 if(k.length===1){e.preventDefault();inp(k)}});
// ---------- init ----------
$('#k1').innerHTML=kbHtml(false,false,true);$('#k2').innerHTML=kbHtml(true,false,true);
$('#fl').innerHTML=FN.slice(0,8).map(function(n,i){return'<span style="--c:'+FC[i]+'">'+n+'</span>'}).join('');
$('#rules').innerHTML=[
 'Rest your fingers on the home row: A S D F for the left hand and J K L ; for the right hand.',
 'Feel the small bumps on F and J. They tell your index fingers where home is.',
 'Each finger owns its own columns. Colours on the Keys tab show which finger goes where.',
 'Use the Shift key on the opposite side to the letter you are capitalising.',
 'Thumbs rest on the Space bar. Use whichever thumb feels natural.',
 'Look at the screen, not at the keys. The glowing key on screen shows the next one.',
 'Accuracy first. Speed follows on its own. A clean round moves you to the next level.',
 'Short daily practice beats a long session once a week.'
].map(function(t){return'<li>'+t+'</li>'}).join('');
$('#ci').innerHTML='<p class="note" style="margin:0">Tap any key below to see which finger types it. Letters, capitals, numbers and symbols are all here.</p>';
theme();ops();start();stats();
})();
</script>
<script>
(function(){function show(id){['a1','a2','a3'].forEach(function(x){document.getElementById(x).hidden=x!==id});try{localStorage.setItem('tt_app',id)}catch(e){}window.scrollTo(0,0)}
document.addEventListener('click',function(e){var b=e.target.closest('.sw button');if(b)show(b.dataset.app)});
try{var s=localStorage.getItem('tt_app');if(s==='a2'||s==='a3')show(s)}catch(e){}})();
</script>
</body>
